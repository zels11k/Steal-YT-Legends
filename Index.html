<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STEAL: YOUTUBE LEGENDS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@300&display=swap" rel="stylesheet">
<style>
:root{
  --red:#B22222; --dark:#8B0000; --white:#FFFFFF; --ink:#111111;
  --head:'Anton','Bebas Neue','Russo One',Impact,'Arial Narrow',sans-serif;
  --body:'Montserrat','Roboto',system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;color:var(--white);font-family:var(--body);font-weight:300;font-size:17px;
  background:linear-gradient(160deg,#2a0000 0%,var(--dark) 45%,#3d0505 100%);
  display:flex;flex-direction:column;align-items:center;overflow:hidden;
}
/* VHS scanlines */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 4px);
  animation:glitch 6s steps(1) infinite}
@keyframes glitch{0%,92%,100%{transform:none;opacity:1}93%{transform:translateX(-3px);opacity:.8}95%{transform:translateX(4px)}97%{transform:translateY(2px);opacity:.9}}

header{position:relative;z-index:1;width:100%;text-align:center;padding:18px 16px 0}
h1{margin:0;font-family:var(--head);font-weight:400;text-transform:uppercase;letter-spacing:.08em;
  font-size:clamp(28px,6vw,56px);line-height:1;color:var(--white);
  text-shadow:2px 0 var(--red),-2px 0 #000}
.sub{margin:10px 0 0;font-size:16px;opacity:.85}

main{position:relative;z-index:1;flex:1;display:flex;align-items:center;justify-content:center;width:100%;padding:16px}
.actions{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}

.btn{
  position:relative;font-family:var(--head);font-size:24px;letter-spacing:.1em;text-transform:uppercase;
  min-width:260px;height:64px;padding:0 32px;border:2px solid var(--red);border-radius:18px;cursor:pointer;
  background:var(--white);color:var(--ink);
  box-shadow:6px 6px 0 var(--ink),0 0 0 0 rgba(255,40,40,.7);
  animation:pulse 2s ease-in-out infinite;
  transition:transform .12s,box-shadow .12s;
}
.btn.alt{background:var(--ink);color:var(--white)}
.btn:hover{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--ink),0 0 18px rgba(255,40,40,.8)}
.btn:active{transform:translate(6px,6px);box-shadow:0 0 0 var(--ink)}
.btn:focus-visible{outline:3px solid var(--white);outline-offset:3px}
@keyframes pulse{50%{border-color:#ff3b3b;box-shadow:6px 6px 0 var(--ink),0 0 22px 4px rgba(255,40,40,.65)}}
.btn .soon{opacity:.35;transition:opacity .3s}
.btn:hover .soon{opacity:1;color:#ff4d4d}

footer{position:relative;z-index:1;width:100%;text-align:center;padding:12px 16px 18px;font-size:12px;opacity:.7}
footer a{color:var(--white)}

/* toast */
#toast{position:fixed;left:50%;top:0;z-index:30;transform:translate(-50%,-150%);
  margin-top:env(safe-area-inset-top,0px);
  background:var(--ink);color:var(--white);border:2px solid var(--red);border-top:0;
  border-radius:0 0 16px 16px;padding:12px 40px;font-family:var(--head);font-size:28px;letter-spacing:.14em;
  box-shadow:0 0 20px rgba(255,40,40,.6);transition:transform .45s cubic-bezier(.2,.9,.3,1)}
#toast.show{transform:translate(-50%,0)}

/* modal */
#modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.7)}
#modal.open{display:flex}
.card{width:100%;max-width:400px;text-align:center;background:var(--ink);border:2px solid var(--red);border-radius:20px;
  padding:32px 24px;box-shadow:0 0 30px rgba(178,34,34,.6);animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.card svg{width:84px;height:84px;fill:var(--white)}
.card h2{font-family:var(--head);font-weight:400;font-size:30px;letter-spacing:.08em;text-transform:uppercase;margin:12px 0 6px}
.card p{margin:0 0 22px;opacity:.75;font-size:15px}
.card .btn{display:flex;align-items:center;justify-content:center;width:100%;min-width:0;height:56px;font-size:20px;text-decoration:none;animation:none}
.close{margin-top:16px;background:none;border:0;color:var(--white);opacity:.6;cursor:pointer;font:inherit;font-size:14px}

@media (max-width:600px){
  .actions{flex-direction:column;width:100%;gap:20px}
  .btn{width:100%;height:60px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header>
  <h1>STEAL: YOUTUBE LEGENDS</h1>
  <p class="sub">Присоединяйся к сообществу легенд YouTube</p>
</header>

<main>
  <div class="actions">
    <button class="btn" id="discordBtn">JOIN DISCORD</button>
    <button class="btn alt" id="robloxBtn">ROBLOX <span class="soon">(SOON)</span></button>
  </div>
</main>

<footer>© 2026 STEAL: YOUTUBE LEGENDS · <a href="#" onclick="return false">Правила</a></footer>

<div id="toast" role="status" aria-live="polite">SOON</div>

<div id="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
  <div class="card">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.2.5a18 18 0 0 0-6.4 0L8.6 3a19.7 19.7 0 0 0-4.9 1.4C.6 9 0 13.5.3 18a19.9 19.9 0 0 0 6 3l.5-.7a13 13 0 0 1-2-1l.5-.4a14.2 14.2 0 0 0 12.2 0l.5.4a13 13 0 0 1-2 1l.5.7a19.8 19.8 0 0 0 6-3c.5-5.200-.8-9.700-3.200-13.600zM8.500 15.300c-1.200 0-2.100-1.100-2.100-2.400s.9-2.400 2.100-2.400 2.100 1.100 2.100 2.400-.9 2.400-2.100 2.400zm7 0c-1.200 0-2.100-1.100-2.100-2.400s.9-2.400 2.100-2.400 2.100 1.100 2.100 2.400-.9 2.400-2.100 2.400z"/></svg>
    <h2 id="mt">STEAL: YOUTUBE LEGENDS</h2>
    <p>Тебя приглашают на Discord-сервер</p>
    <a class="btn" href="https://discord.gg/7K9hV62xv3" target="_blank" rel="noopener">Принять приглашение</a>
    <button class="close" id="closeBtn">Закрыть</button>
  </div>
</div>

<script>
const modal=document.getElementById('modal'),toast=document.getElementById('toast');
let timer;
const open=()=>{modal.classList.add('open');document.querySelector('.card .btn').focus()};
const close=()=>{modal.classList.remove('open');document.getElementById('discordBtn').focus()};
document.getElementById('discordBtn').onclick=open;
document.getElementById('closeBtn').onclick=close;
modal.addEventListener('click',e=>{if(e.target===modal)close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('open'))close()});
document.getElementById('robloxBtn').onclick=()=>{
  clearTimeout(timer);toast.classList.add('show');
  timer=setTimeout(()=>toast.classList.remove('show'),2000);
};
</script>
</body>
</html>
